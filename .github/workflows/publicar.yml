name: Publicar nas redes
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'publicar ou verificar'
        default: 'publicar'
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publicar peças aprovadas
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
        run: python publicar/publicar.py "${{ github.event.inputs.modo || 'publicar' }}"
      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A agenda
          if ! git diff --cached --quiet; then
            git commit -m "Agenda: resultado da publicação"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
